name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace packages/core
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm ci
        working-directory: services/auth-proxy
      - run: npm run typecheck
        working-directory: services/auth-proxy
      - run: npm audit
        working-directory: services/auth-proxy

  # CLI が対応する最小の Node.js（packages/cli の engines）でも動くことを確かめる
  test-min-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build --workspace packages/core
      - run: npm test
